<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Takenlijst</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; min-height: 100vh; font-family: sans-serif; padding: 2rem 1rem; color: #e0e0e0; }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 500; color: #fff; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
    .input-row input { flex: 1; background: #16213e; border: 0.5px solid #2a2a4a; border-radius: 8px; padding: 10px 14px; color: #e0e0e0; font-size: 15px; outline: none; }
    .input-row input:focus { border-color: #534AB7; }
    .input-row input::placeholder { color: #555577; }
    .input-row button { background: #534AB7; border: none; border-radius: 8px; padding: 10px 18px; color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .task-item { background: #16213e; border: 0.5px solid #2a2a4a; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .task-item.done .task-title { text-decoration: line-through; color: #555577; }
    .task-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #534AB7; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .task-check.checked { background: #534AB7; }
    .task-title { flex: 1; font-size: 15px; }
    .task-meta { font-size: 12px; color: #555577; flex-shrink: 0; }
    .task-delete { background: none; border: none; color: #555577; cursor: pointer; font-size: 16px; }
    .task-delete:hover { color: #E24B4A; }
  </style>
</head>
<body>
<div class="container">
  <h1><i class="ti ti-checklist"></i> Takenlijst</h1>
  <div class="input-row">
    <input id="taskInput" placeholder="Nieuwe taak toevoegen...">
    <button onclick="addTask()"><i class="ti ti-plus"></i> Toevoegen</button>
  </div>
  <div id="taskList"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>
</body>
</html>
